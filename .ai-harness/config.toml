[harness]
name = "adaptive-ai-coding-orchestrator"
version = 1
default_provider = "claude"
auto_route = true
learn_after_run = true
auto_groom = true
checkpoint_long_runs = true
require_verification_before_complete = true

[loop_engineering]
enabled = true
strategy = "generation + evaluation + memory + scheduling + optimization"
default_risk = "normal"
allow_explicit_bounded_loop = true
max_explicit_iterations = 4
minimum_utility_gain = 0.03
parallel_read_only_subagents = true
provenance_required_for_learning = true
stop_on_diminishing_returns = true

[runtime]
mode = "single-adaptive-run"
looping_enabled = false
recursive_self_invocation = false
user_requested_loop_only = true

[providers.claude]
command = ["{python}", ".ai-harness/safe_provider.py", "--prompt-file", "{prompt_file}", "--", "claude", "-p"]
supports_local_execution = true

[providers.codex]
command = ["{python}", ".ai-harness/safe_provider.py", "--prompt-file", "{prompt_file}", "--", "codex", "exec"]
supports_local_execution = true

[providers.gemini]
command = ["{python}", ".ai-harness/safe_provider.py", "--prompt-file", "{prompt_file}", "--", "gemini", "-p"]
supports_local_execution = true

[providers.chatgpt]
command = []
supports_local_execution = false

[execution]
phase_timeout_seconds = 600
provider_timeout_seconds = 600
validation_timeout_seconds = 600
max_phase_retries = 1
max_repair_attempts = 2
require_new_evidence_for_retry = true

[validation]
auto_discover = true
commands = []

[scope]
allowed_paths = ["."]
protected_paths = [".git", ".ai-harness/runs"]

[orchestration]
max_passes = 10
mandatory_high_risk_passes = [6, 7, 8, 10]
policy_file = ".ai-harness/TEN_LOOP_POLICY.md"

[durability]
journal_failure_is_non_fatal = false

[reviewers]
require_consensus_for_high_risk = true

[knowledge]
require_fresh_index_for_high_risk = true

[verification]
require_acceptance_evidence = true
require_diff_check = true

[learning]
min_observations_for_promotion = 3
min_success_rate_for_promotion = 0.80
max_memory_items = 200

[capabilities]
module = "portable.agent_capabilities"
fabric = "portable.capability_fabric.CapabilityFabric"
memory = "portable.persistent_memory.PersistentMemory"
scheduler = "portable.automation_scheduler.AutomationScheduler"
quality_gate = "portable.output_quality.OutputQualityGate"
provider_adapters = "portable.capability_fabric.ProviderAdapterRegistry"
max_delegates = 4
memory_write_approval_required = true
memory_max_chars = 100000
require_explicit_external_adapters = true
skills_progressive_disclosure = true
scheduled_work_reenters_aer = true
quality_gate_required_before_complete = true

[sandbox]
enabled = true
module = ".ai-harness/runtime/sandbox.py"
runner = ".ai-harness/runtime/tool_runner.py"
no_shell = true
workspace_confinement = true
network_default = false
timeout_seconds = 600
max_memory_mb = 2048
max_processes = 32
max_output_chars = 12000
fail_closed = true
stronger_os_sandbox_recommended_for_hostile_code = true

[lsp]
enabled = true
module = ".ai-harness/runtime/lsp_server.py"
protocol = "stdio-jsonrpc"
auto_discovery = true
prefer_native_language_server = true
fallback_navigation = true
workspace_confinement = true

[feedback]
enabled = true
module = ".ai-harness/runtime/feedback_loop.py"
event_file = ".ai-harness/learning/feedback-events.jsonl"
min_observations_for_candidate = 5
min_success_rate = 0.80
min_verification_rate = 0.90
candidate_only_until_regression = true
require_safety_gate = true
require_shadow_and_canary = true
never_auto_activate_executable_changes = true

[auto_compaction]
enabled = true
module = ".ai-harness/runtime/auto_compaction.py"
budget_chars = 12000
trigger_when_over_budget = true
preserve_sections = ["GOAL", "BOUNDARIES", "ACCEPTANCE", "SECURITY/PERMISSIONS", "CURRENT STATE", "TASK CONTRACT", "EVIDENCE", "VERIFY", "RISKS"]
dedupe_repeated_lines = true
record_digest = true

[router]
route_budget = 900
memory_budget = 900
context_budget = 3200
max_history_chars = 4000
minimum_confidence_for_auto_capability = 0.68
escalate_after_failed_verifications = 2

[model_routing]
default_tier = "standard"
minimum_viable_model = true
policy = "smallest-safe-model"
low = { reasoning = "low", purpose = "classification, summarization, simple edits" }
standard = { reasoning = "medium", purpose = "normal implementation and debugging" }
high = { reasoning = "high", purpose = "architecture, difficult debugging, risky changes" }
critical = { reasoning = "xhigh", purpose = "hardest long-horizon or high-risk tasks" }
auto_escalate = true
escalate_on_risk = ["high", "critical"]
escalate_on_uncertainty = ["unknown"]
escalate_after_failed_verifications = 2
prefer_efficient_provider_for_token_heavy_work = true

[workflows.research]
phases = ["route", "context", "research", "learn"]

[context]
stable_prefix = true
prefer_repository_map = true
prefer_targeted_reads = true
preprocess_relevance = true
relevance_module = ".ai-harness/runtime/token_optimizer.py"
compress_prior_phase_output = true
preserve_checkpoints = true
policy_file = ".ai-harness/CONTEXT_POLICY.md"

[flash_context]
enabled = true
policy_file = ".ai-harness/FLASH_CONTEXT_POLICY.md"
strategy = "stable-prefix + content-addressed-page-cache + evidence-priority-compaction + tiled-context + relevance-ranking + bounded-evidence"
budget_chars = 12000
repository_budget_chars = 9000
memory_budget_chars = 2000
history_budget_chars = 2400
preserve_verification_evidence = true
third_party_dependency = false

[context_cache]
enabled = true
module = ".ai-harness/runtime/context_cache.py"
page_chars = 1800
content_addressed = true
stable_prefix_reuse = true
