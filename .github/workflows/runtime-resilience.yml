name: Runtime Resilience Matrix

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  impact:
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.detect.outputs.required }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Classify changed-file impact
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import fnmatch, os, subprocess
          event = os.environ['EVENT_NAME']
          if event == 'workflow_dispatch':
              required = True
              changed = []
          else:
              base = os.environ.get('BASE_SHA', '')
              head = os.environ.get('HEAD_SHA', '')
              if not base or set(base) == {'0'}:
                  required, changed = True, []
              else:
                  changed = subprocess.check_output(['git', 'diff', '--name-only', base, head], text=True).splitlines()
                  patterns = [".github/workflows/runtime-resilience.yml","portable/state_graph.py","portable/crew_adapters.py","portable/orchestration.py","portable/auren_runtime.py","portable/supervisor.py","portable/agency_state_graph.py","portable/hybrid_model_router.py","portable/bounded_subprocess.py","portable/process_isolated_crew_dispatch.py","portable/evidence_gate.py",".ai-harness/engine.py","portable/runtime_recovery.py","portable/adaptive_runtime.py","portable/harness_experiments.py","portable/harness_isolation_verifier.py","portable/engineering_plan.py","portable/engineering_plan_store.py","portable/engineering_context_packet.py","portable/engineering_plan_recovery.py","portable/engineering_plan_dispatch.py","portable/persistent_experiment_learning.py","portable/experiment_learning_cycle.py","portable/local_endpoint.py","portable/muxin_session_adapter.py","state/**","tests/test_state_paths.py","tests/test_state_graph_hardening.py","tests/test_promotion_evidence_chain.py","tests/test_external_decision_evidence_ingestion.py","tests/test_evidence_freshness.py","tests/test_crew_adapters.py","tests/test_graph_agent_team.py","tests/test_execution_controller_promotion_gate.py","tests/test_hybrid_model_router.py","tests/test_bounded_subprocess_fault_injection.py","tests/test_process_isolated_crew_dispatch.py","tests/test_evidence_gate.py","tests/test_harness_task_deadline.py","tests/test_runtime_recovery.py","tests/test_adaptive_runtime_recovery_integration.py","tests/test_harness_experiments.py","tests/test_harness_isolation_verifier.py","tests/test_engineering_plan.py","tests/test_engineering_plan_store.py","tests/test_engineering_context_packet.py","tests/test_engineering_plan_recovery.py","tests/test_engineering_plan_dispatch.py","tests/test_persistent_experiment_learning.py","tests/test_experiment_learning_cycle.py","tests/test_local_endpoint_security.py","tests/test_control_center_api.py","site/control-center.html"]
                  required = any(fnmatch.fnmatchcase(path, pattern) for path in changed for pattern in patterns)
          print('Changed files:')
          print('\n'.join(changed) if changed else '(none or full validation requested)')
          print(f'Validation required: {required}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'required={str(required).lower()}\n')
          PY

  durable-runtime:
    needs: impact
    if: needs.impact.outputs.required == 'true'
    name: Durable runtime (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile portable runtime and state paths
        run: python -m compileall -q portable state
      - name: Verify signed Arena isolation receipt binding for harness experiments
        run: python -m unittest tests.test_harness_isolation_verifier -v
      - name: Verify spec-driven plan schema, dependency graph and lifecycle gates
        run: python -m unittest tests.test_engineering_plan tests.test_engineering_plan_store tests.test_engineering_plan_recovery tests.test_engineering_plan_dispatch tests.test_persistent_experiment_learning tests.test_experiment_learning_cycle -v
      - name: Verify checkpoint durability, migration idempotency, and rollback-safe legacy preservation
        run: python -m unittest tests.test_state_paths -v
      - name: Verify receipt uniqueness and verified learning-input boundary
        run: python -m unittest tests.test_promotion_evidence_chain tests.test_external_decision_evidence_ingestion tests.test_evidence_freshness -v
      - name: Stress concurrent in-memory receipt claims
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            echo "Arena ledger concurrency pass ${attempt}/5"
            python -m unittest tests.test_promotion_evidence_chain -k concurrent_receipt_claim -v
          done
      - name: Verify bounded StateGraph timeout and retry contracts
        run: python -m unittest tests.test_state_graph_hardening -v
      - name: Fault-inject hard termination, inherited deadlines, cancellation, and output bounds
        run: python -m unittest tests.test_bounded_subprocess_fault_injection -v
      - name: Fault-inject process-isolated crew dispatch hard stops and deadlines
        run: python -m unittest tests.test_process_isolated_crew_dispatch -v
      - name: Fault-inject evidence gate hard-stop and total deadline propagation
        run: python -m unittest tests.test_evidence_gate -v
      - name: Fault-inject harness validation timeout and deadline propagation
        run: python -m unittest tests.test_harness_task_deadline -v
