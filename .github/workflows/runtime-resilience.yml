name: Runtime Resilience Matrix

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  impact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      required: ${{ steps.detect.outputs.required }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Classify changed-file impact
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import fnmatch, os, subprocess
          event = os.environ['EVENT_NAME']
          if event == 'workflow_dispatch':
              required = True
              changed = []
          else:
              base = os.environ.get('BASE_SHA', '')
              head = os.environ.get('HEAD_SHA', '')
              if not base or set(base) == {'0'}:
                  required, changed = True, []
              else:
                  changed = subprocess.check_output(['git', 'diff', '--name-only', base, head], text=True).splitlines()
                  patterns = [".github/workflows/runtime-resilience.yml",".github/actions/python-test-setup/action.yml","scripts/run_runtime_resilience_shard.py","portable/durable_approval.py","portable/canonical_evidence_ledger.py","tests/test_canonical_evidence_ledger.py","portable/agency_evolution_gates.py","tests/test_agency_evolution_gates.py","portable/agency_evolution_runtime.py","tests/test_agency_evolution_runtime.py","portable/vibe_coding_adapters.py","tests/test_vibe_coding_adapters.py","portable/subprocess_provider.py","tests/test_subprocess_provider.py","portable/local_offload.py","tests/test_assigned_subprocess_scope.py","portable/vibe_coding_host.py","tests/test_vibe_coding_host.py","tests/test_mcp_oversized_frame_process_termination.py","portable/action_governance.py","portable/execution_boundary.py","tests/test_execution_boundary.py","portable/governed_sandbox_execution.py","tests/test_governed_sandbox_execution.py","portable/ai_coding_agency_bridge.py","tests/test_ai_coding_agency_bridge.py","portable/agency_team_orchestrator.py","tests/test_agency_team_orchestrator.py","scripts/impact_policy.py","tests/test_impact_policy.py","scripts/pr_integration_guard.py","tests/test_pr_integration_guard.py",".github/workflows/pr-integration-guard.yml","portable/workflow_profile.py","tests/test_workflow_profile.py","tests/test_workflow_profile_integration.py","portable/agent_org_runtime.py","tests/test_agent_org_runtime.py","portable/agent_profiles.py","portable/agent_profile_registry_manager.py","tests/test_agent_profiles.py","tests/test_agent_profile_registry_manager.py","portable/agent_execution_guard.py","portable/sdk.py","tests/test_auren_sdk.py","portable/guarded_filesystem.py","tests/test_guarded_filesystem.py","tests/test_agent_execution_guard.py","portable/execution_controller.py","tests/test_execution_controller_cancellation.py","portable/provider_operation_lifecycle.py","portable/ci_repair_watchdog.py","portable/engineering_recovery.py","tests/test_provider_operation_lifecycle.py","tests/test_ci_repair_watchdog.py","tests/test_engineering_recovery.py","tests/test_engineering_recovery_fault_matrix.py","tests/test_execution_controller_restart.py","tests/test_durable_approval.py","portable/continuous_execution.py","tests/test_continuous_execution.py","portable/durable_routines.py","tests/test_durable_routines.py","portable/state_graph.py","portable/crew_adapters.py","portable/orchestration.py","portable/auren_runtime.py","portable/supervisor.py","portable/agency_state_graph.py","tests/test_agency_state_graph.py","portable/graph_workspace_adoption.py","tests/test_graph_workspace_adoption.py","tests/test_graph_workspace_registry.py","portable/independent_graph_verification.py","tests/test_independent_graph_verification.py","portable/graph_worker_lifecycle.py","tests/test_graph_worker_lifecycle.py","portable/hybrid_model_router.py","portable/bounded_subprocess.py","portable/windows_kill_job.py","portable/process_isolated_crew_dispatch.py","portable/evidence_gate.py","portable/crash_recovery.py","portable/side_effect_ledger.py",".ai-harness/engine.py",".ai-harness/resilient_provider.py",".ai-harness/provider.py","portable/runtime_recovery.py","portable/adaptive_runtime.py","portable/adaptive_trigger.py","portable/remote_mcp.py","portable/remote_mcp_server.py","portable/local_host.py","portable/local_composition.py","portable/mcp_stdio_proxy.py","tests/test_local_mcp_host.py","tests/test_local_composition.py","portable/trigger_runtime.py","tests/test_remote_mcp_service.py","tests/test_remote_mcp_network_acceptance.py","portable/harness_experiments.py","portable/harness_isolation_verifier.py","portable/engineering_plan.py","portable/engineering_plan_store.py","portable/engineering_context_packet.py","portable/engineering_plan_recovery.py","portable/engineering_plan_dispatch.py","portable/trusted_plan_dispatch.py","tests/test_trusted_plan_dispatch.py","portable/persistent_experiment_learning.py","portable/experiment_learning_cycle.py","portable/progress_journal.py","tests/test_progress_journal.py","tests/test_progress_journal_integration.py","portable/autonomous_company.py","tests/test_autonomous_company.py","portable/engineering_evidence_capture.py","tests/test_engineering_evidence_capture.py","portable/dashboard_server.py","tests/test_control_center_api.py","portable/engineering_dashboard.py","tests/test_engineering_dashboard.py","portable/agency_observability.py","tests/test_agency_observability.py","portable/agency_observability_ops.py","tests/test_agency_observability_ops.py","portable/agency_release_lifecycle.py","tests/test_agency_release_lifecycle.py","tests/test_release_rollback_observability.py","portable/agency_runtime.py","tests/test_agency_runtime.py","tests/test_agency_runtime_release_integration.py","portable/postgres_attestation_replay_registry.py","tests/test_postgres_attestation_replay_registry.py","portable/attestation_freshness.py","tests/test_attestation_freshness.py",".github/workflows/postgres-attestation-replay.yml","portable/local_endpoint.py","portable/muxin_session_adapter.py","tests/test_dashboard_sessions.py","portable/lifecycle_projection.py","tests/test_lifecycle_projection.py","state/**","tests/test_state_paths.py","tests/test_crash_recovery_fault_injection.py","tests/test_side_effect_ledger_crash_fault_injection.py","tests/test_side_effect_ledger.py","tests/test_consequential_run_once_recovery.py","tests/test_consequential_outer_receipt_crash.py","tests/test_state_graph_hardening.py","tests/test_promotion_evidence_chain.py","tests/test_external_decision_evidence_ingestion.py","portable/persistent_evidence_graph.py","tests/test_persistent_evidence_graph.py","tests/test_persistent_evidence_graph_crash.py","tests/test_evidence_freshness.py","tests/test_crew_adapters.py","tests/test_graph_agent_team.py","tests/test_graph_agent_crews.py","tests/test_execution_controller_promotion_gate.py","tests/test_hybrid_model_router.py","tests/test_bounded_subprocess_fault_injection.py","tests/test_process_isolated_crew_dispatch.py","tests/test_evidence_gate.py","tests/test_harness_task_deadline.py","tests/test_runtime_recovery.py","tests/test_adaptive_runtime_recovery_integration.py","tests/test_harness_experiments.py","tests/test_harness_isolation_verifier.py","tests/test_engineering_plan.py","tests/test_engineering_plan_store.py","tests/test_engineering_context_packet.py","tests/test_engineering_plan_recovery.py","tests/test_engineering_plan_dispatch.py","tests/test_persistent_experiment_learning.py","tests/test_persistent_learning_observability.py","tests/test_experiment_learning_cycle.py","tests/test_local_endpoint_security.py","tests/test_control_center_api.py","site/control-center.html"]
                  required = any(fnmatch.fnmatchcase(path, pattern) for path in changed for pattern in patterns)
          print('Changed files:')
          print('\n'.join(changed) if changed else '(none or full validation requested)')
          print(f'Validation required: {required}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'required={str(required).lower()}\n')
          PY

  durable-runtime:
    needs: impact
    if: needs.impact.outputs.required == 'true'
    name: Durable runtime (${{ matrix.os }}, Python ${{ matrix.python-version }}, ${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.11'
            shard: durable-state
          - os: ubuntu-latest
            python-version: '3.11'
            shard: mcp-runtime
          - os: ubuntu-latest
            python-version: '3.11'
            shard: authority
          - os: ubuntu-latest
            python-version: '3.11'
            shard: planning
          - os: ubuntu-latest
            python-version: '3.11'
            shard: evidence-faults
          - os: ubuntu-latest
            python-version: '3.12'
            shard: durable-state
          - os: ubuntu-latest
            python-version: '3.12'
            shard: mcp-runtime
          - os: ubuntu-latest
            python-version: '3.12'
            shard: authority
          - os: ubuntu-latest
            python-version: '3.12'
            shard: planning
          - os: ubuntu-latest
            python-version: '3.12'
            shard: evidence-faults
          - os: windows-latest
            python-version: '3.11'
            shard: durable-state-core
          - os: windows-latest
            python-version: '3.11'
            shard: durable-state-integration
          - os: windows-latest
            python-version: '3.11'
            shard: mcp-runtime
          - os: windows-latest
            python-version: '3.11'
            shard: authority-core
          - os: windows-latest
            python-version: '3.11'
            shard: authority-integration
          - os: windows-latest
            python-version: '3.11'
            shard: planning
          - os: windows-latest
            python-version: '3.11'
            shard: evidence-faults
          - os: windows-latest
            python-version: '3.12'
            shard: durable-state-core
          - os: windows-latest
            python-version: '3.12'
            shard: durable-state-integration
          - os: windows-latest
            python-version: '3.12'
            shard: mcp-runtime
          - os: windows-latest
            python-version: '3.12'
            shard: authority-core
          - os: windows-latest
            python-version: '3.12'
            shard: authority-integration
          - os: windows-latest
            python-version: '3.12'
            shard: planning
          - os: windows-latest
            python-version: '3.12'
            shard: evidence-faults
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/python-test-setup
        with:
          python-version: ${{ matrix.python-version }}
          install-uvicorn: ${{ matrix.shard == 'mcp-runtime' }}
      - name: Compile portable runtime and state paths
        run: python -m compileall -q portable state
      - name: Run ${{ matrix.shard }} test shard
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: python scripts/run_runtime_resilience_shard.py ${{ matrix.shard }}
