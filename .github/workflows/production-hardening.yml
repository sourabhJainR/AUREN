name: Production AI Harness Hardening

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  impact:
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.detect.outputs.required }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Classify changed-file impact
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import fnmatch, os, subprocess
          event = os.environ['EVENT_NAME']
          if event == 'workflow_dispatch' or os.environ.get('GITHUB_REF', '').startswith('refs/tags/'):
              required = True
              changed = []
          else:
              base = os.environ.get('BASE_SHA', '')
              head = os.environ.get('HEAD_SHA', '')
              if not base or set(base) == {'0'}:
                  required, changed = True, []
              else:
                  changed = subprocess.check_output(['git', 'diff', '--name-only', base, head], text=True).splitlines()
                  patterns = [".github/workflows/production-hardening.yml",".ai-harness/**","portable/auren_runtime.py","portable/orchestration.py","portable/state_graph.py","portable/crew_adapters.py","portable/execution_controller.py","portable/engineering_recovery.py","portable/side_effect_ledger.py","portable/provider_operation_lifecycle.py","portable/ci_repair_watchdog.py","portable/continuous_execution.py","portable/progress_journal.py","portable/canonical_evidence_ledger.py","portable/engineering_design_guard.py","portable/ai_era_principles.py","ENGINEERING_PRINCIPLES.md","docs/AI_ERA_FOUNDATION_PRINCIPLES.md","tests/test_ai_era_foundation_principles.py","scripts/impact_policy.py","tests/test_impact_policy.py","tests/test_provider_operation_lifecycle.py","tests/test_ci_repair_watchdog.py","tests/test_continuous_execution.py","tests/test_side_effect_ledger.py","tests/test_engineering_recovery.py","tests/test_engineering_recovery_fault_matrix.py","tests/test_execution_controller.py","tests/test_execution_controller_restart.py","tests/test_execution_controller_promotion_rollback_contract.py","tests/test_progress_journal.py","tests/test_progress_journal_integration.py","tests/test_canonical_evidence_ledger.py","state/**","tests/test_security_gate.py","tests/test_state_validator.py","tests/test_provider.py","tests/test_execution_controls.py","tests/test_verification_gate.py","tests/test_artifact_chain.py","tests/test_orchestration.py","tests/test_work_report.py","tests/test_regression_memory.py","tests/test_work_report_traceability.py","tests/test_requirement_traceability.py","tests/test_context_pipeline_recovery.py","tests/test_crew_adapters.py","tests/test_graph_agent_team.py"]
                  required = any(fnmatch.fnmatchcase(path, pattern) for path in changed for pattern in patterns)
          import sys
          sys.path.insert(0, '.')
          from scripts.impact_policy import classify_changes
          policy = classify_changes(changed)
          required = required or bool(policy['hardening_required'])
          print('Required focused suites:')
          print(', '.join(policy['required_suites']) if policy['required_suites'] else '(none)')
          print('Changed files:')
          print('\n'.join(changed) if changed else '(none or full validation requested)')
          print(f'Validation required: {required}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'required={str(required).lower()}\n')
          PY

  hardening:
    needs: impact
    if: needs.impact.outputs.required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Prepare CI directories
        if: always()
        run: |
          mkdir -p ci-artifacts
          mkdir -p dist/auren-portable
      - name: Compile AUREN components
        run: |
          python -m py_compile auren_cli.py portable/auren_runtime.py portable/orchestration.py portable/side_effect_ledger.py portable/provider_operation_lifecycle.py portable/ci_repair_watchdog.py portable/continuous_execution.py portable/execution_controller.py portable/engineering_recovery.py portable/progress_journal.py portable/canonical_evidence_ledger.py scripts/impact_policy.py .ai-harness/security_gate.py .ai-harness/safe_provider.py .ai-harness/state_validator.py .ai-harness/verification_gate.py .ai-harness/run.py .ai-harness/provider.py .ai-harness/p1_lifecycle.py .ai-harness/runtime/artifact_chain.py .ai-harness/runtime/work_report.py .ai-harness/runtime/regression_memory.py .ai-harness/runtime/regression_selector.py .ai-harness/runtime/learning_controller.py .ai-harness/runtime/work_report_traceability.py .ai-harness/runtime/requirement_traceability.py .ai-harness/runtime/context_pipeline.py .ai-harness/runtime/context_planner.py
      - name: Run focused hardening tests
        run: |
          set -euo pipefail
          tests=(tests.test_security_gate tests.test_state_validator tests.test_provider tests.test_execution_controls tests.test_execution_controller tests.test_verification_gate tests.test_artifact_chain tests.test_orchestration tests.test_work_report tests.test_regression_memory tests.test_work_report_traceability tests.test_requirement_traceability tests.test_context_pipeline_recovery tests.test_impact_policy tests.test_provider_operation_lifecycle tests.test_ci_repair_watchdog tests.test_continuous_execution tests.test_side_effect_ledger tests.test_engineering_recovery tests.test_engineering_recovery_fault_matrix tests.test_execution_controller_restart tests.test_execution_controller_promotion_rollback_contract tests.test_progress_journal tests.test_progress_journal_integration tests.test_side_effect_ledger_crash_fault_injection tests.test_canonical_evidence_ledger tests.test_engineering_evidence_capture tests.test_execution_controller_evidence_capture tests.test_consequential_run_once_recovery tests.test_state_root_rollback_rehearsal tests.test_continuous_execution_cli)
          for test_module in "${tests[@]}"; do
            echo "===== RUNNING ${test_module} ====="
            python -m unittest "${test_module}" -v 2>&1 | tee "ci-artifacts/${test_module##*.}.log"
          done
      - name: Validate configuration
        run: |
          cat > /tmp/validate_config.py <<'PY'
          import json
          import tomllib
          from pathlib import Path
          config = tomllib.load(open('.ai-harness/config.toml', 'rb'))
          plugin = json.loads(Path('.claude-plugin/plugin.json').read_text())
          harness_major = int(config['harness']['version']); plugin_major = int(plugin['version'].split('.')[0])
          assert harness_major == plugin_major
          assert config['durability']['journal_failure_is_non_fatal'] is False
          assert config['reviewers']['require_consensus_for_high_risk'] is True
          assert config.get('knowledge', {}).get('require_fresh_index_for_high_risk', True) is True
          assert config['verification']['require_acceptance_evidence'] is True
          assert config['verification']['require_diff_check'] is True
          assert config['execution']['require_new_evidence_for_retry'] is True
          print(f'Validated harness/plugin major version: {harness_major}')
          PY
          set -o pipefail
          python /tmp/validate_config.py 2>&1 | tee ci-artifacts/config-validation.log
      - name: Validate ledger schema and implementation contract
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee ci-artifacts/ledger-validation.log
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, '.ai-harness')
          from state_validator import validate_state
          schema = json.loads(Path('state/engineering-state.schema.json').read_text())
          assert schema['$schema'] == 'https://json-schema.org/draft/2020-12/schema'
          sample = {'schema_version':'1.0','task_id':'ci','status':'investigating','intent':{'goal':'ci'},'contract':{'requirements':[],'acceptance':[],'protected_behavior':[]},'repo_facts':[],'decisions':[],'evidence':[],'changeset':{},'verification':[],'outcome':{'status':'unknown'},'open_risks':[],'next':[]}
          assert validate_state(sample) == []
          print('Ledger schema and implementation contract validated successfully')
          PY
      - name: Build AUREN portable bundle
        run: |
          python auren_cli.py build --output dist/auren-portable.zip --source-commit "$GITHUB_SHA"
          test -s dist/auren-portable.zip
      - name: Verify AUREN portable bundle
        run: |
          set -o pipefail
          python auren_cli.py verify dist/auren-portable.zip 2>&1 | tee ci-artifacts/auren-verification.log
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('dist/auren-portable.zip') as z:
              names = set(z.namelist()); required = {'auren-bundle.json','auren_cli.py','payload/portable/auren_runtime.py','payload/portable/orchestration.py'}
              missing = sorted(required - names)
              if missing: raise SystemExit(f'AUREN portable bundle is missing: {missing}')
          print('AUREN portable bundle contains the CLI, runtime, orchestration engine, and manifest')
          PY
      - name: Assemble directly runnable AUREN distribution
        run: |
          rm -rf dist/auren-portable
          mkdir -p dist/auren-portable
          python - <<'PY'
          import shutil, zipfile
          from pathlib import Path
          bundle = Path('dist/auren-portable.zip'); staging = Path('dist/auren-portable-staging'); destination = Path('dist/auren-portable')
          shutil.rmtree(staging, ignore_errors=True); staging.mkdir(parents=True)
          with zipfile.ZipFile(bundle) as z: z.extractall(staging)
          payload = staging / 'payload'
          for name in ('.ai-harness', 'portable', 'skills'):
              source = payload / name
              if source.exists(): shutil.copytree(source, destination / name, dirs_exist_ok=True)
          shutil.copy2(staging / 'auren_cli.py', destination / 'auren_cli.py'); shutil.copy2(staging / 'auren-bundle.json', destination / 'auren-bundle.json'); shutil.rmtree(staging, ignore_errors=True)
          required = (destination/'auren-bundle.json', destination/'auren_cli.py', destination/'portable'/'auren_runtime.py', destination/'portable'/'orchestration.py')
          for path in required:
              if not path.is_file(): raise SystemExit(f'Missing directly runnable distribution file: {path}')
          print('Directly runnable AUREN distribution assembled')
          PY
      - name: Smoke-test directly runnable AUREN distribution
        run: |
          python dist/auren-portable/auren_cli.py verify dist/auren-portable.zip > ci-artifacts/extracted-cli-smoke.log
          grep -q '"portable": true' ci-artifacts/extracted-cli-smoke.log
      - name: Collect CI metadata
        if: always()
        run: |
          printf 'commit=%s\n' "$GITHUB_SHA" > ci-artifacts/run-metadata.txt
          printf 'run_id=%s\n' "$GITHUB_RUN_ID" >> ci-artifacts/run-metadata.txt
          printf 'workflow=%s\n' "$GITHUB_WORKFLOW" >> ci-artifacts/run-metadata.txt
          printf 'ref=%s\n' "$GITHUB_REF" >> ci-artifacts/run-metadata.txt
      - name: Publish clean AUREN distribution
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: auren-portable
          path: |
            dist/auren-portable/
            dist/auren-portable.zip
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
      - name: Publish CI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: auren-ci-evidence
          path: ci-artifacts/
          if-no-files-found: error
          retention-days: 14

  final-status:
    if: always()
    needs: [impact, hardening]
    runs-on: ubuntu-latest
    steps:
      - name: Classify required validation outcome
        env:
          IMPACT_JOB_RESULT: ${{ needs.impact.result }}
          HARDENING_REQUIRED: ${{ needs.impact.outputs.required }}
          HARDENING_RESULT: ${{ needs.hardening.result }}
        run: |
          python - <<'PY'
          import os
          required = os.environ.get("HARDENING_REQUIRED") == "true"
          impact_result = os.environ.get("IMPACT_JOB_RESULT", "unknown")
          result = os.environ.get("HARDENING_RESULT", "unknown")
          if impact_result != "success":
              status = "failed"
          elif result == "success":
              status = "passed"
          elif result == "skipped" and required:
              status = "skipped-but-required"
          elif result == "skipped" and not required:
              status = "skipped-not-required"
          else:
              status = "failed"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Recovery hardening status\n\n")
              summary.write(f"- Impact classification: {impact_result}\n")
              summary.write(f"- Hardening required: {str(required).lower()}\n")
              summary.write(f"- Final status: **{status}**\n")
          print(f"Final hardening status: {status}")
          if status in {"failed", "skipped-but-required"}:
              raise SystemExit(1)
          PY
