name: Production AI Harness Hardening

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.ai-harness/**'
      - 'portable/**'
      - 'aer_cli.py'
      - 'state/**'
      - 'tests/**'
      - '.github/workflows/production-hardening.yml'
  push:
    branches: [main]
    paths:
      - '.ai-harness/**'
      - 'portable/**'
      - 'aer_cli.py'
      - 'state/**'
      - 'tests/**'
      - '.github/workflows/production-hardening.yml'

jobs:
  hardening:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Prepare CI directories
        if: always()
        run: |
          mkdir -p ci-artifacts
          mkdir -p dist/aer-portable
      - name: Compile AER components
        run: |
          python -m py_compile aer_cli.py portable/aer_runtime.py portable/orchestration.py .ai-harness/security_gate.py .ai-harness/safe_provider.py .ai-harness/state_validator.py .ai-harness/verification_gate.py .ai-harness/run.py .ai-harness/provider.py .ai-harness/p1_lifecycle.py .ai-harness/runtime/artifact_chain.py .ai-harness/runtime/work_report.py .ai-harness/runtime/regression_memory.py .ai-harness/runtime/regression_selector.py .ai-harness/runtime/learning_controller.py .ai-harness/runtime/work_report_traceability.py .ai-harness/runtime/requirement_traceability.py .ai-harness/runtime/context_pipeline.py .ai-harness/runtime/context_planner.py
      - name: Run focused hardening tests
        run: |
          set -euo pipefail
          tests=(tests.test_security_gate tests.test_state_validator tests.test_provider tests.test_execution_controls tests.test_verification_gate tests.test_artifact_chain tests.test_orchestration tests.test_work_report tests.test_regression_memory tests.test_work_report_traceability tests.test_requirement_traceability tests.test_context_pipeline_recovery)
          for test_module in "${tests[@]}"; do
            echo "===== RUNNING ${test_module} ====="
            python -m unittest "${test_module}" -v 2>&1 | tee "ci-artifacts/${test_module##*.}.log"
          done
      - name: Validate configuration
        run: |
          cat > /tmp/validate_config.py <<'PY'
          import json
          import tomllib
          from pathlib import Path
          config = tomllib.load(open('.ai-harness/config.toml', 'rb'))
          plugin = json.loads(Path('.claude-plugin/plugin.json').read_text())
          harness_major = int(config['harness']['version']); plugin_major = int(plugin['version'].split('.')[0])
          assert harness_major == plugin_major
          assert config['durability']['journal_failure_is_non_fatal'] is False
          assert config['reviewers']['require_consensus_for_high_risk'] is True
          assert config.get('knowledge', {}).get('require_fresh_index_for_high_risk', True) is True
          assert config['verification']['require_acceptance_evidence'] is True
          assert config['verification']['require_diff_check'] is True
          assert config['execution']['require_new_evidence_for_retry'] is True
          print(f'Validated harness/plugin major version: {harness_major}')
          PY
          set -o pipefail
          python /tmp/validate_config.py 2>&1 | tee ci-artifacts/config-validation.log
      - name: Validate ledger schema and implementation contract
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee ci-artifacts/ledger-validation.log
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, '.ai-harness')
          from state_validator import validate_state
          schema = json.loads(Path('state/engineering-state.schema.json').read_text())
          assert schema['$schema'] == 'https://json-schema.org/draft/2020-12/schema'
          sample = {'schema_version':'1.0','task_id':'ci','status':'investigating','intent':{'goal':'ci'},'contract':{'requirements':[],'acceptance':[],'protected_behavior':[]},'repo_facts':[],'decisions':[],'evidence':[],'changeset':{},'verification':[],'outcome':{'status':'unknown'},'open_risks':[],'next':[]}
          assert validate_state(sample) == []
          print('Ledger schema and implementation contract validated successfully')
          PY
      - name: Build AER portable bundle
        run: |
          python aer_cli.py build --output dist/aer-portable.zip --source-commit "$GITHUB_SHA"
          test -s dist/aer-portable.zip
      - name: Verify AER portable bundle
        run: |
          set -o pipefail
          python aer_cli.py verify dist/aer-portable.zip 2>&1 | tee ci-artifacts/aer-verification.log
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('dist/aer-portable.zip') as z:
              names = set(z.namelist()); required = {'aer-bundle.json','aer_cli.py','payload/portable/aer_runtime.py','payload/portable/orchestration.py'}
              missing = sorted(required - names)
              if missing: raise SystemExit(f'AER portable bundle is missing: {missing}')
          print('AER portable bundle contains the CLI, runtime, orchestration engine, and manifest')
          PY
      - name: Assemble directly runnable AER distribution
        run: |
          rm -rf dist/aer-portable
          mkdir -p dist/aer-portable
          python - <<'PY'
          import shutil, zipfile
          from pathlib import Path
          bundle = Path('dist/aer-portable.zip'); staging = Path('dist/aer-portable-staging'); destination = Path('dist/aer-portable')
          shutil.rmtree(staging, ignore_errors=True); staging.mkdir(parents=True)
          with zipfile.ZipFile(bundle) as z: z.extractall(staging)
          payload = staging / 'payload'
          for name in ('.ai-harness', 'portable', 'skills'):
              source = payload / name
              if source.exists(): shutil.copytree(source, destination / name, dirs_exist_ok=True)
          shutil.copy2(staging / 'aer_cli.py', destination / 'aer_cli.py'); shutil.copy2(staging / 'aer-bundle.json', destination / 'aer-bundle.json'); shutil.rmtree(staging, ignore_errors=True)
          required = (destination/'aer-bundle.json', destination/'aer_cli.py', destination/'portable'/'aer_runtime.py', destination/'portable'/'orchestration.py')
          for path in required:
              if not path.is_file(): raise SystemExit(f'Missing directly runnable distribution file: {path}')
          print('Directly runnable AER distribution assembled')
          PY
      - name: Smoke-test directly runnable AER distribution
        run: |
          python dist/aer-portable/aer_cli.py verify dist/aer-portable.zip > ci-artifacts/extracted-cli-smoke.log
          grep -q '"portable": true' ci-artifacts/extracted-cli-smoke.log
      - name: Collect CI metadata
        if: always()
        run: |
          printf 'commit=%s\n' "$GITHUB_SHA" > ci-artifacts/run-metadata.txt
          printf 'run_id=%s\n' "$GITHUB_RUN_ID" >> ci-artifacts/run-metadata.txt
          printf 'workflow=%s\n' "$GITHUB_WORKFLOW" >> ci-artifacts/run-metadata.txt
          printf 'ref=%s\n' "$GITHUB_REF" >> ci-artifacts/run-metadata.txt
      - name: Publish clean AER distribution
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: aer-portable
          path: |
            dist/aer-portable/
            dist/aer-portable.zip
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
      - name: Publish CI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aer-ci-evidence
          path: ci-artifacts/
          if-no-files-found: error
          retention-days: 14
