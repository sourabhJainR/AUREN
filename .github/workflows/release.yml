name: AUREN v1 Release

on:
  push:
    branches:
      - release/v1.0-packaging
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, for example v1.0.0
        required: true
        default: v1.0.0

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Resolve release tag
        id: release
        env:
          EVENT_TAG: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${EVENT_TAG}"
          elif [[ -n "${INPUT_TAG}" ]]; then
            TAG="${INPUT_TAG}"
          else
            TAG="v1.0.0"
          fi
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: ${TAG}"
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
      - name: Verify release version
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
        run: |
          python - <<'PY'
          import json, os
          version = json.load(open('.claude-plugin/plugin.json', encoding='utf-8'))['version']
          expected = os.environ['EXPECTED_VERSION']
          if version != expected:
              raise SystemExit(f'plugin version {version} does not match release version {expected}')
          print(f'AUREN release version verified: {version}')
          PY
      - name: Run release validation
        run: |
          python -m py_compile aer_cli.py portable/aer_runtime.py
          python aer_cli.py build --output auren-portable.zip
          python aer_cli.py verify auren-portable.zip
      - name: Verify release bundle contents
        run: |
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('auren-portable.zip') as z:
              names = set(z.namelist())
              required = {
                  'aer_cli.py',
                  'aer-bundle.json',
                  'payload/.claude-plugin/plugin.json',
                  'payload/.claude-plugin/marketplace.json',
                  'payload/skills/ai-coding-orchestrator/SKILL.md',
              }
              missing = sorted(required - names)
              if missing:
                  raise SystemExit('missing release payload: ' + ', '.join(missing))
          print('AUREN v1 release bundle contents verified')
          PY
      - name: Create release checksums
        run: sha256sum auren-portable.zip > SHA256SUMS
      - name: Create GitHub release and upload install assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; refreshing assets."
          else
            gh release create "${TAG}" \
              --target "${GITHUB_SHA}" \
              --title "AUREN ${TAG}" \
              --generate-notes \
              --notes "AUREN portable ${TAG}. Includes a repository-isolated distribution, one-command installers, and SHA-256 checksum."
          fi
          gh release upload "${TAG}" auren-portable.zip install.sh install.ps1 SHA256SUMS --clobber
