name: Legacy Jekyll Pages workflow (disabled)

# This workflow is intentionally non-deploying. AUREN's canonical public site
# is built from site/ by .github/workflows/deploy-pages.yml. Keeping this
# workflow manual-only prevents a root-directory Jekyll build from racing
# with or overwriting the canonical site deployment.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Explain canonical deployment
        run: |
          echo "This legacy workflow does not publish GitHub Pages."
          echo "Canonical source: site/"
          echo "Use the Deploy AUREN documentation workflow."
