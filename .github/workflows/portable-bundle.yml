name: AUREN Portable Bundle

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    paths:
      - '.ai-harness/**'
      - '.agents/skills/ai-coding-orchestrator/**'
      - '.claude-plugin/**'
      - '.claude/skills/ai-coding-orchestrator/**'
      - 'skills/ai-coding-orchestrator/**'
      - 'skills/engineering/**'
      - 'portable/**'
      - 'state/**'
      - 'architecture/**'
      - 'auren_cli.py'
      - 'tests/**'
      - '.github/workflows/portable-bundle.yml'

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Run deterministic contract tests
        run: |
          PYTHONPATH=.:.ai-harness python -m unittest \
            tests.test_portable_auren tests.test_task_planner tests.test_impact_analysis \
            tests.test_bidirectional_install tests.test_contract_alignment tests.test_graph_agent_team \
            tests.test_engineering_design_guard tests.test_state_graph_hardening \
            tests.test_execution_contract tests.test_evidence_contract tests.test_adaptive_planning_evidence tests.test_execution_strategy_learning tests.test_skill_group_evidence -v
      - name: Read AUREN version
        id: version
        run: |
          VERSION=$(python -c "import json; print(json.load(open('.claude-plugin/plugin.json', encoding='utf-8'))['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build canonical portable bundle
        run: python auren_cli.py build --output auren-portable.zip
      - name: Verify canonical portable bundle
        run: python auren_cli.py verify auren-portable.zip
      - name: Verify canonical payload and version
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - <<'PY'
          import json, os, zipfile
          with zipfile.ZipFile('auren-portable.zip') as z:
              names = set(z.namelist())
              required = {'auren_cli.py','auren-bundle.json','payload/.claude-plugin/plugin.json','payload/.claude-plugin/marketplace.json','payload/skills/ai-coding-orchestrator/SKILL.md','payload/.ai-harness/ARTIFACT_UPGRADE_CONTRACT.json'}
              missing = sorted(required - names)
              if missing:
                  raise SystemExit('missing canonical AUREN payload: ' + ', '.join(missing))
              expected = os.environ['EXPECTED_VERSION']
              plugin = json.loads(z.read('payload/.claude-plugin/plugin.json'))
              manifest = json.loads(z.read('auren-bundle.json'))
              if plugin.get('version') != expected or manifest.get('version') != expected:
                  raise SystemExit(f'version mismatch: plugin={plugin.get("version")} manifest={manifest.get("version")} expected={expected}')
              recorded = {item['path'] for item in manifest['files']}
              for path in ('auren_cli.py','.claude-plugin/plugin.json','.ai-harness/ARTIFACT_UPGRADE_CONTRACT.json'):
                  if path not in recorded:
                      raise SystemExit(f'{path} is not integrity-covered')
              contract = json.loads(z.read('payload/.ai-harness/ARTIFACT_UPGRADE_CONTRACT.json'))
              if contract.get('downgrade') != 'explicit_install_only' or contract.get('automatic_update_downgrade') != 'forbidden':
                  raise SystemExit('artifact downgrade policy changed unexpectedly')
          print(f'Canonical AUREN portable bundle verified: {expected}')
          PY
      - name: Publish reusable AUREN distribution artifact
        uses: actions/upload-artifact@v7
        with:
          name: auren-portable
          path: auren-portable.zip
          if-no-files-found: error
          retention-days: '30'
      - name: Create bundle checksum
        run: sha256sum auren-portable.zip > auren-portable.sha256
      - name: Publish reusable AUREN checksum artifact
        uses: actions/upload-artifact@v7
        with:
          name: auren-portable-checksum
          path: auren-portable.sha256
          if-no-files-found: error
          retention-days: '30'
