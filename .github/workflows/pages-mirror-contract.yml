name: Pages Mirror Contract

on:
  pull_request:
    paths:
      - 'site/**'
      - 'docs/index.html'
      - 'docs/404.html'
      - '.github/workflows/pages-mirror-contract.yml'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate entrypoints and byte-identical mirrors
        run: |
          test -s site/index.html
          test -s site/404.html
          test -s docs/index.html
          test -s docs/404.html
          grep -q '<title>AUREN' site/index.html
          grep -q '<title>AUREN' site/404.html
          cmp -s site/index.html docs/index.html
          cmp -s site/404.html docs/404.html
