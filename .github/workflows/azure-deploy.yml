name: Azure Web App and Functions Deployment

on:
  workflow_dispatch:
    inputs:
      deploy_web_app:
        description: Deploy the Web App package
        type: boolean
        default: true
        required: true
      deploy_functions:
        description: Deploy the Functions package
        type: boolean
        default: true
        required: true
      web_app_name:
        description: Azure App Service name (required when deploying the Web App)
        type: string
        required: false
      function_app_name:
        description: Azure Function App name (required when deploying Functions)
        type: string
        required: false
      web_app_package:
        description: Path to the prebuilt Web App ZIP package
        type: string
        default: artifacts/webapp.zip
        required: true
      functions_package:
        description: Path to the prebuilt Functions ZIP package
        type: string
        default: artifacts/functions.zip
        required: true
      slot_name:
        description: Optional App Service deployment slot; leave blank for production
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: azure-deployment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate selected deployment inputs
        env:
          DEPLOY_WEB_APP: ${{ inputs.deploy_web_app }}
          DEPLOY_FUNCTIONS: ${{ inputs.deploy_functions }}
          WEB_APP_NAME: ${{ inputs.web_app_name }}
          FUNCTION_APP_NAME: ${{ inputs.function_app_name }}
        run: |
          set -euo pipefail
          if [[ "$DEPLOY_WEB_APP" == "true" && -z "$WEB_APP_NAME" ]]; then
            echo "web_app_name is required when deploy_web_app is true" >&2
            exit 1
          fi
          if [[ "$DEPLOY_FUNCTIONS" == "true" && -z "$FUNCTION_APP_NAME" ]]; then
            echo "function_app_name is required when deploy_functions is true" >&2
            exit 1
          fi
          if [[ "$DEPLOY_WEB_APP" != "true" && "$DEPLOY_FUNCTIONS" != "true" ]]; then
            echo "Select at least one deployment target" >&2
            exit 1
          fi

  deploy-web-app:
    needs: validate
    if: inputs.deploy_web_app
    runs-on: ubuntu-latest
    environment: azure-production
    steps:
      - uses: actions/checkout@v4
      - name: Verify Web App package exists
        env:
          PACKAGE: ${{ inputs.web_app_package }}
        run: test -f "$PACKAGE" || { echo "Package not found: $PACKAGE" >&2; exit 1; }
      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Deploy Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ inputs.web_app_name }}
          slot-name: ${{ inputs.slot_name || '' }}
          package: ${{ inputs.web_app_package }}

  deploy-functions:
    needs: validate
    if: inputs.deploy_functions
    runs-on: ubuntu-latest
    environment: azure-production
    steps:
      - uses: actions/checkout@v4
      - name: Verify Functions package exists
        env:
          PACKAGE: ${{ inputs.functions_package }}
        run: test -f "$PACKAGE" || { echo "Package not found: $PACKAGE" >&2; exit 1; }
      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Deploy Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ inputs.function_app_name }}
          package: ${{ inputs.functions_package }}
