name: One-time AUREN nomenclature migration

on:
  push:
    branches: [refactor/unify-aer-to-auren]

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, 'AUREN nomenclature migration') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rewrite legacy identity
        shell: python
        run: |
          from pathlib import Path
          legacy_upper = "AE" + "R"
          legacy_lower = "ae" + "r"
          legacy_mixed = "Ae" + "r"
          skip_parts = {".git", "__pycache__", ".pytest_cache", ".mypy_cache", ".ruff_cache"}
          binary_suffixes = {".png", ".jpg", ".jpeg", ".gif", ".webp", ".zip", ".gz", ".pdf", ".pyc", ".whl"}
          changed = []
          root = Path(".").resolve()
          for path in sorted(root.rglob("*")):
              if not path.is_file() or any(part in skip_parts for part in path.parts):
                  continue
              if path.suffix.lower() in binary_suffixes:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (OSError, UnicodeDecodeError):
                  continue
              updated = text.replace(legacy_upper, "AUREN").replace(legacy_mixed, "Auren").replace(legacy_lower, "auren")
              if updated != text:
                  path.write_text(updated, encoding="utf-8")
                  changed.append(path.as_posix())
          if changed:
              print("Migrated:")
              print("\n".join(changed))
          else:
              print("No legacy identity remains.")
      - name: Commit and push
        shell: bash
        run: |
          git config user.name "AUREN Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: complete AUREN nomenclature migration"
          git push origin HEAD:refactor/unify-aer-to-auren
