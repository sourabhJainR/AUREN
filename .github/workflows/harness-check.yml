name: AI Harness Check

on:
  push:
    paths:
      - '.github/workflows/**'
      - '.github/actions/publish-ci-artifacts/**'
      - '.ai-harness/**'
      - '.agents/**'
      - '.claude-plugin/**'
      - 'skills/**'
      - 'scripts/**'
      - 'portable/**'
      - 'auren_cli.py'
      - 'docs/**'
      - '.claude/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'GEMINI.md'
      - 'CODEOWNERS'
      - 'PLUGIN.md'
      - 'install.sh'
      - 'state/**'
      - 'tests/**'
      - 'examples/**'
  pull_request:
    paths:
      - '.ai-harness/**'
      - '.agents/**'
      - '.claude-plugin/**'
      - 'skills/**'
      - 'scripts/**'
      - 'portable/**'
      - 'auren_cli.py'
      - 'docs/**'
      - '.claude/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'GEMINI.md'
      - 'CODEOWNERS'
      - 'PLUGIN.md'
      - 'install.sh'
      - 'state/**'
      - 'tests/**'
      - 'examples/**'
      - '.github/actions/publish-ci-artifacts/**'

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Prepare CI artifacts
        if: always()
        run: |
          rm -rf ci-artifacts
          mkdir -p ci-artifacts
          cp auren_cli.py ci-artifacts/auren_cli.py
          printf 'Repository: %s\nCommit: %s\nRun: %s\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_RUN_ID" > ci-artifacts/run-metadata.txt
          cat > ci-artifacts/evidence-artifact-manifest.json <<'EOF'
          {"schema_version":"1.0","artifacts":["auren_cli.py","run-metadata.txt","targeted-learning-tests.txt","auren-portable.zip"]}
          EOF
          cat > ci-artifacts/AUREN_CLI.md <<EOF
          # AUREN CLI

          The public AUREN command-line entry point is **auren_cli.py**.

          [View auren_cli.py in this exact commit](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/auren_cli.py)
          EOF
      - name: Validate Python harness
        run: python -m unittest discover -s tests -v
      - name: Capture adaptive learning verification evidence
        run: |
          set -o pipefail
          python -m unittest tests.test_skill_group_evidence tests.test_execution_strategy tests.test_execution_strategy_learning -v 2>&1 | tee ci-artifacts/targeted-learning-tests.txt
      - name: Validate reference applications
        run: |
          python -m unittest discover -s examples/habit-tracker/tests -v
          python -m unittest discover -s examples/family-financial-register/tests -v
      - name: Compile harness, runtime, extensions and installer
        run: python -m py_compile .ai-harness/run.py .ai-harness/engine.py .ai-harness/context_engine.py .ai-harness/knowledge_fabric.py .ai-harness/extension_registry.py .ai-harness/provider.py .ai-harness/observability.py .ai-harness/project_profile.py .ai-harness/placement.py .ai-harness/worktree.py .ai-harness/review_agents.py .ai-harness/runtime/p0.py .ai-harness/runtime/p1.py .ai-harness/runtime/p1_pipeline.py .ai-harness/runtime/p2.py .ai-harness/runtime/p2_pipeline.py .ai-harness/runtime/legacy.py .ai-harness/runtime/execution_controls.py .ai-harness/runtime/intent_contract.py .ai-harness/runtime/learning.py .ai-harness/runtime/learning_engine.py .ai-harness/runtime/policy_registry.py .ai-harness/runtime/regression_replay.py .ai-harness/runtime/rollback_controller.py .ai-harness/runtime/learning_controller.py .ai-harness/runtime/canary_evaluator.py .ai-harness/runtime/rca.py .ai-harness/runtime/collaboration.py .ai-harness/runtime/second_brain.py .ai-harness/runtime/loop_engine.py .ai-harness/runtime/capability_catalog.py .ai-harness/runtime/instruction_loader.py .ai-harness/runtime/run_journal.py scripts/install_skill.py scripts/validate_plugin.py scripts/run_evals.py scripts/run_p0_evals.py scripts/run_p2_evals.py scripts/run_full_suite.py scripts/run_p1_evals.py scripts/report_regression.py scripts/heartbeat.py portable/auren_runtime.py auren_cli.py .ai-harness/p1_lifecycle.py examples/habit-tracker/app.py examples/family-financial-register/app.py
      - name: Validate portable bundle build and integrity
        run: |
          python auren_cli.py build --output /tmp/auren-portable.zip
          python auren_cli.py verify /tmp/auren-portable.zip
          cp /tmp/auren-portable.zip ci-artifacts/auren-portable.zip
          python - <<'PY'
          import json, zipfile
          with zipfile.ZipFile('/tmp/auren-portable.zip') as archive:
              manifest=json.loads(archive.read('auren-bundle.json'))
              assert manifest['portable'] is True
              assert manifest['provider_neutral'] is True
              assert archive.getinfo('auren_cli.py')
              assert archive.getinfo('payload/portable/auren_runtime.py')
              assert manifest['files']
          PY
      - name: Validate configuration
        run: python -c "import tomllib; tomllib.load(open('.ai-harness/config.toml','rb')); tomllib.load(open('.ai-harness/extension_registry.toml','rb'))"
      - name: Validate regression corpus
        run: python -c "import json; from pathlib import Path; p=Path('.ai-harness/regressions/corpus.jsonl'); rows=[json.loads(x) for x in p.read_text(encoding='utf-8').splitlines() if x.strip()]; assert rows and all(r.get('case_id') and r.get('task_class') and 'expected_success' in r and 'expected_verification' in r for r in rows)"
      - name: Validate P0 state schema
        run: |
          python - <<'PY'
          import json
          with open("state/engineering-state.schema.json", encoding="utf-8") as handle:
              schema = json.load(handle)
          assert schema["$schema"] == "https://json-schema.org/draft/2020-12/schema"
          assert schema["$id"].endswith("/schemas/engineering-state/v1")
          assert schema["properties"]["schema_version"]["const"] == "1.0"
          assert "outcome" in schema["properties"]
          PY
      - name: Validate plugin and marketplace manifests
        run: python scripts/validate_plugin.py
      - name: Validate deployable skill metadata
        run: python -c "from pathlib import Path; import re; paths=[Path('skills/ai-coding-orchestrator/SKILL.md'),Path('.agents/skills/ai-coding-orchestrator/SKILL.md'),Path('.claude/skills/ai-coding-orchestrator/SKILL.md')]; assert all(p.exists() and re.search(r'(?m)^name:\\s*ai-coding-orchestrator\\s*$',p.read_text(encoding='utf-8')) and re.search(r'(?m)^description:\\s*\\S',p.read_text(encoding='utf-8')) and len(p.read_text(encoding='utf-8')) <= 9000 for p in paths)"
      - name: Validate Flash-context policy
        run: python -c "from pathlib import Path; p=Path('.ai-harness/FLASH_CONTEXT_POLICY.md'); assert p.exists() and 'FlashAttention' in p.read_text(encoding='utf-8')"
      - name: Validate knowledge fabric policy
        run: python -c "from pathlib import Path; p=Path('.ai-harness/KNOWLEDGE_FABRIC_POLICY.md'); assert p.exists() and 'Graphify' in p.read_text(encoding='utf-8') and 'codebase-memory-mcp' in p.read_text(encoding='utf-8')"
      - name: Validate core has no external AUREN linkage
        run: |
          python - <<'PY'
          from pathlib import Path
          hits=[]
          roots=[Path('.ai-harness'),Path('.agents'),Path('.claude'),Path('skills'),Path('state'),Path('scripts'),Path('portable'),Path('auren_cli.py'),Path('README.md'),Path('AGENTS.md')]
          for root in roots:
              files=[root] if root.is_file() else root.rglob('*')
              for path in files:
                  if path.is_file() and path.suffix.lower() in {'.md','.py','.toml','.json','.yml','.yaml','.sh'}:
                      text=path.read_text(encoding='utf-8',errors='ignore').lower()
                      if 'github.com/sourabhjainr/auren' in text or 'auren_effectiveness_integration' in text:
                          hits.append(str(path))
          assert not hits, f'forbidden external linkage: {hits}'
          PY
      - name: Validate RCA and execution-control contract
        run: python -m unittest tests.test_legacy_runtime tests.test_execution_controls tests.test_intent_contract tests.test_provider tests.test_rca tests.test_collaboration -v
      - name: Detect optional extensions
        run: python .ai-harness/extension_registry.py
      - name: Run deterministic routing eval suite
        run: python scripts/run_evals.py
      - name: Run deterministic P0 contract eval suite
        run: python scripts/run_p0_evals.py
      - name: Run deterministic P1 integration eval suite
        run: python scripts/run_p1_evals.py
      - name: Run deterministic P2 capability eval suite
        run: python scripts/run_p2_evals.py
      - name: Run harness evaluation suite
        run: python .ai-harness/run.py eval
      - name: Check convention profile
        run: python .ai-harness/project_profile.py
      - name: Check placement analyzer
        run: python .ai-harness/placement.py ExampleService.py ExampleConstants.py ExampleHandler.py
      - name: Check worktree helper
        run: python .ai-harness/worktree.py list
      - name: Run complete deterministic system suite
        run: python scripts/run_full_suite.py
      - name: Publish CI artifacts
        if: always()
        uses: ./.github/actions/publish-ci-artifacts
        with:
          artifact-name: auren-harness-results
          path: ci-artifacts/
          retention-days: '14'
      - name: Publish AUREN CLI link
        if: always()
        run: |
          {
            echo '## AUREN CLI'
            echo
            echo "[View auren_cli.py in this exact commit](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/auren_cli.py)"
            echo
            echo 'The same auren_cli.py is included in the auren-harness-results artifact.'
          } >> "$GITHUB_STEP_SUMMARY"
