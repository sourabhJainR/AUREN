name: Deploy AUREN documentation

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/index.html'
      - 'docs/404.html'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Validate Pages entrypoints
        run: |
          test -s site/index.html
          test -s site/404.html
          test -s docs/index.html
          test -s docs/404.html
          grep -q '<title>AUREN' site/index.html
          grep -q '<title>AUREN' site/404.html

      - name: Build deployment manifest
        run: |
          {
            echo "AUREN GitHub Pages deployment"
            echo "commit=${GITHUB_SHA}"
            echo "source=site"
            sha256sum site/index.html site/404.html
          } | tee pages-deployment-manifest.txt

      - name: Upload deployment manifest
        uses: actions/upload-artifact@v4
        with:
          name: auren-pages-deployment-manifest
          path: pages-deployment-manifest.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
