name: Architecture Integrity

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  architecture-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install optional cryptographic verification test dependency
        run: python -m pip install 'cryptography>=42,<47'
      - name: Validate architecture constitution
        run: python scripts/validate_architecture.py
      - name: Enforce canonical AUREN naming
        run: python scripts/validate_auren_identity.py
      - name: Run architecture contract regression tests
        run: python -m unittest tests.test_architecture_contract -v
      - name: Run decision record and promotion gate regressions
        run: python -m unittest tests.test_decision_gate -v
      - name: Run execution-time capability promotion gate regressions
        run: python -m unittest tests.test_capability_promotion_gate -v
      - name: Run default execution controller promotion gate regressions
        run: python -m unittest tests.test_execution_controller_promotion_gate -v
      - name: Run canonical exact-head evidence ledger regressions
        run: python -m unittest tests.test_canonical_evidence_ledger -v
      - name: Run automatic engineering evidence capture and signed receipt regressions
        run: python -m unittest tests.test_engineering_evidence_capture tests.test_execution_controller_evidence_capture tests.test_external_signed_evidence_ingestion tests.test_trusted_repository_context tests.test_record_ci_evidence -v
      - name: Run executable and isolated Arena kernel regressions
        run: python -m unittest tests.test_independent_arena tests.test_isolated_arena_runner tests.test_container_sandboxed_arena -v
      - name: Run explicit Arena acceptance and sealed holdout threshold regressions
        run: python -m unittest tests.test_arena_acceptance -v
      - name: Build minimal Arena policy image for real sandbox smoke test
        run: |
          docker build --pull -t auren-arena-policy-test tests/fixtures/arena-policy
          echo "AUREN_ARENA_TEST_IMAGE=$(docker image inspect --format='{{.Id}}' auren-arena-policy-test)" >> "$GITHUB_ENV"
      - name: Run real container-backed Arena smoke test
        run: python -m unittest tests.test_container_sandboxed_arena_integration -v
      - name: Run Ed25519 sealed receipt and custody authentication regressions
        run: python -m unittest tests.test_sealed_arena_signature tests.test_sealed_arena_custody -v
      - name: Run sealed Arena boundary, exchange, gateway, and replay regressions
        run: python -m unittest tests.test_sealed_arena_boundary tests.test_sealed_arena_exchange tests.test_external_evaluator_gateway tests.test_external_evaluator_gateway_budget tests.test_sealed_arena_replay_concurrency -v
      - name: Run signed cross-domain provenance and transfer-metric regressions
        run: python -m unittest tests.test_sealed_cross_domain_attestation tests.test_sealed_cross_domain_lineage tests.test_sealed_cross_domain_request_binding tests.test_cross_domain_transfer_metrics -v
      - name: Run independent attestation and key separation regressions
        run: python -m unittest tests.test_independent_evaluation_attestation tests.test_attestation_key_separation tests.test_attested_cross_project_transfer tests.test_attestation_freshness -v
      - name: Run external campaign attestation regressions
        run: python -m unittest tests.test_external_evaluation_campaign tests.test_external_generalization_runner -v
      - name: Run causal promotion and evidence-chain regressions
        run: python -m unittest tests.test_causal_capability_promotion tests.test_promotion_evidence_chain tests.test_arena_run_receipt tests.test_external_decision_evidence_ingestion tests.test_evidence_freshness -v
      - name: Validate empirical capability coverage matrix
        run: python -m unittest tests.test_capability_coverage_matrix -v
      - name: Run expanded engineering principle guard regressions
        run: python -m unittest tests.test_engineering_design_guard tests.test_engineering_principles_enforcement tests.test_orchestration_engineering_guard -v
      - name: Compile dependency-free portable runtime
        run: python -m compileall -q portable scripts
      - name: Record exact-head CI evidence
        if: always()
        env:
          AUREN_CI_REPOSITORY: ${{ github.repository }}
          AUREN_CI_HEAD_SHA: ${{ github.sha }}
          AUREN_CI_RUN_ID: ${{ github.run_id }}
          AUREN_CI_ATTEMPT: ${{ github.run_attempt }}
          AUREN_CI_JOB: ${{ github.job }}
          AUREN_CI_WORKFLOW: ${{ github.workflow }}
          AUREN_CI_STATUS: ${{ job.status }}
          AUREN_EVIDENCE_SINK_URL: ${{ secrets.AUREN_EVIDENCE_SINK_URL }}
          AUREN_EVIDENCE_SINK_TOKEN: ${{ secrets.AUREN_EVIDENCE_SINK_TOKEN }}
        run: python scripts/record_ci_evidence.py
      - name: Retain exact-head CI evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auren-engineering-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: .auren/ci-engineering-evidence.json
          retention-days: 90
          if-no-files-found: warn
