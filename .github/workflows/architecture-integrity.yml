name: Architecture Integrity

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  architecture-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate architecture constitution
        run: python scripts/validate_architecture.py
      - name: Validate unified AUREN nomenclature
        run: python scripts/validate_auren_nomenclature.py
      - name: Run architecture contract regression tests
        run: python -m unittest tests.test_architecture_contract -v
      - name: Compile dependency-free portable runtime
        run: python -m compileall -q portable scripts
