name: AUREN cleanup contract

on:
  pull_request:
    paths:
      - 'docs/CLEANUP_PROTECTED_ARTIFACTS.yml'
      - 'docs/REPOSITORY_CLEANUP_AND_ROLLBACK.md'
      - 'README.md'
      - 'site/**'
      - 'docs/index.html'
      - 'docs/404.html'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'docs/CLEANUP_PROTECTED_ARTIFACTS.yml'
      - 'docs/REPOSITORY_CLEANUP_AND_ROLLBACK.md'
      - 'README.md'
      - 'site/**'
      - 'docs/index.html'
      - 'docs/404.html'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  protected-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate cleanup governance contract
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/CLEANUP_PROTECTED_ARTIFACTS.yml
          test -f docs/REPOSITORY_CLEANUP_AND_ROLLBACK.md

          required=(
            "README.md"
            ".github/workflows/deploy-pages.yml"
            "site/index.html"
            "site/404.html"
            "docs/index.html"
            "docs/404.html"
            "docs/GITHUB_PAGES.md"
          )

          for path in "${required[@]}"; do
            test -f "$path" || {
              echo "::error::Protected AUREN artifact is missing: $path"
              exit 1
            }
          done

          grep -q "Repository cleanup and rollback governance" README.md
          grep -q "cleanup regression" docs/REPOSITORY_CLEANUP_AND_ROLLBACK.md
          grep -q "Rollback strategy" docs/REPOSITORY_CLEANUP_AND_ROLLBACK.md
          echo "AUREN cleanup contract and protected presence artifacts are intact."

      - name: Build installable regression artifact
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Build and verify portable bundle
        run: |
          set -euo pipefail
          python -m py_compile auren_cli.py portable/auren_runtime.py
          python auren_cli.py build --output auren-portable.zip
          python auren_cli.py verify auren-portable.zip
          sha256sum auren-portable.zip > auren-portable.sha256
          # Keep the stable launcher beside the bundle so a downloaded
          # regression artifact is immediately usable without cloning AUREN.
          cp auren_cli.py auren_cli.py
          chmod +x auren_cli.py
      - name: Smoke test standalone launcher against bundle
        run: |
          set -euo pipefail
          python auren_cli.py auren-portable.zip --help >/dev/null
      - name: Publish installable cleanup regression artifact
        uses: actions/upload-artifact@v7
        with:
          name: auren-cleanup-regression-installable
          path: |
            auren_cli.py
            auren-portable.zip
            auren-portable.sha256
          if-no-files-found: error
          retention-days: '30'
