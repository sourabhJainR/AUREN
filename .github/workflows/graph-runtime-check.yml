name: Graph Runtime Check

on:
  pull_request:
    paths:
      - '.ai-harness/runtime/**'
      - '.ai-harness/provider.py'
      - '.ai-harness/safe_provider.py'
      - '.ai-harness/resilient_provider.py'
      - 'portable/agency_state_graph.py'
      - 'portable/agent_patterns.py'
      - 'tests/test_agency_state_graph.py'
      - 'tests/test_graph_agent_team.py'
      - 'tests/test_agent_patterns.py'
      - 'tests/test_response_resilience.py'
      - '.github/workflows/graph-runtime-check.yml'
  push:
    paths:
      - '.ai-harness/runtime/**'
      - '.ai-harness/provider.py'
      - '.ai-harness/safe_provider.py'
      - '.ai-harness/resilient_provider.py'
      - 'portable/agency_state_graph.py'
      - 'portable/agent_patterns.py'
      - 'tests/test_agency_state_graph.py'
      - 'tests/test_graph_agent_team.py'
      - 'tests/test_agent_patterns.py'
      - 'tests/test_response_resilience.py'
      - '.github/workflows/graph-runtime-check.yml'

jobs:
  graph-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Compile all AUREN runtime modules
        run: python -m compileall -q .ai-harness portable
      - name: Run graph, agent-pattern and response resilience tests
        run: |
          python -m unittest tests.test_agency_state_graph -v
          python -m unittest tests.test_graph_agent_team -v
          python -m unittest tests.test_agent_patterns -v
          python -m unittest tests.test_response_resilience -v
          python -m unittest discover -s .ai-harness/tests -v
      - name: Validate portable build
        run: |
          python auren_cli.py build --output /tmp/auren-portable.zip
          python auren_cli.py verify /tmp/auren-portable.zip
