name: Python test setup
description: Set up a cached Python environment with the shared CI test dependencies.

inputs:
  python-version:
    description: Python version to install.
    required: true
  install-uvicorn:
    description: Install Uvicorn for live ASGI acceptance tests.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: .github/actions/python-test-setup/action.yml
    - name: Install shared test dependencies
      shell: bash
      env:
        INSTALL_UVICORN: ${{ inputs.install-uvicorn }}
      run: |
        packages=(pytest)
        if [[ "$INSTALL_UVICORN" == "true" ]]; then
          packages+=("uvicorn>=0.35,<1")
        fi
        python -m pip install --disable-pip-version-check "${packages[@]}"
