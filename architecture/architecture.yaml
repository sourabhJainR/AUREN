{
  "contract_version": 1,
  "architecture": {
    "name": "Autonomous Unified Reasoning & Engineering Network",
    "short_name": "AUREN",
    "target_line": "AUREN",
    "mode": "unified",
    "authority": "Canonical product architecture and ownership contract for the AUREN system."
  },
  "principles": [
    "one_owner_per_concern",
    "portable_is_dependency_free",
    "learning_cannot_authorize",
    "release_requires_verification",
    "stale_evidence_requires_refresh",
    "adapters_and_views_are_not_authority",
    "execution_state_is_canonical_and_serializable",
    "probabilities_are_not_facts",
    "context_is_snapshot_bound",
    "reuse_before_new_implementation",
    "usage_compatibility_by_default",
    "minimal_data_access",
    "performance_parity",
    "auren_single_identity",
    "six_domain_ownership",
    "guarded_lifecycle_mutation",
    "independent_arena_evidence"
  ],
  "domains": {
    "core": {
      "canonical_owner": "AUREN Core",
      "role": "world model, self model, reasoning and goals",
      "rule": "AUREN Core owns world model, self model, reasoning and goals; it cannot authorize consequential execution."
    },
    "engine": {
      "canonical_owner": "AUREN Engine",
      "role": "planning, StateGraph execution, agent teams and resource-aware execution",
      "rule": "AUREN Engine owns planning, StateGraph execution, agent teams and resource routing; Guard controls consequential authority."
    },
    "memory": {
      "canonical_owner": "AUREN Memory",
      "role": "episodic, semantic, engineering and evidence-graph persistence",
      "rule": "AUREN Memory owns episodic, semantic, engineering and evidence-graph persistence; stored observations do not become facts without verification."
    },
    "learning": {
      "canonical_owner": "AUREN Learning",
      "role": "experimentation, causal attribution, capability invention and curriculum evolution",
      "rule": "AUREN Learning owns experimentation, causal attribution, capability invention and curriculum evolution; it cannot grant permissions, bypass verification, or authorize release."
    },
    "arena": {
      "canonical_owner": "AUREN Arena",
      "role": "independent evaluation, holdouts, transfer and attestation",
      "rule": "AUREN Arena owns independent evaluation, holdouts, transfer and attestation; evaluation cannot promote capabilities or act as its own oracle."
    },
    "guard": {
      "canonical_owner": "AUREN Guard",
      "role": "security, authority, verification, canary and rollback",
      "rule": "AUREN Guard owns security, authority, verification, canary and rollback; consequential lifecycle mutation requires Guard authorization."
    }
  },
  "lifecycle": [
    "intent",
    "contract",
    "repo_facts",
    "decisions",
    "evidence",
    "plan",
    "execute",
    "verify",
    "review",
    "regression",
    "release",
    "outcome",
    "learn"
  ],
  "dependency_direction": {
    "portable": [
      "stdlib",
      "declared_python_dependencies"
    ],
    "skills": [
      "portable",
      "repository_contracts",
      "host_capabilities"
    ],
    "harness": [
      "portable",
      "skills",
      "host_capabilities",
      "policy"
    ],
    "adapters": [
      "canonical_domains"
    ],
    "views": [
      "canonical_domains",
      "evidence"
    ]
  },
  "forbidden_patterns": [
    "second_repository_index",
    "second_capability_catalog",
    "second_durable_memory_store",
    "second_evidence_store",
    "parallel_workflow_engine",
    "second_decision_engine",
    "learning_as_authority",
    "evaluation_as_authority",
    "release_without_verification",
    "portable_imports_host_surfaces",
    "docs_as_runtime_authority",
    "probability_as_verification",
    "duplicate_existing_implementation_without_reuse_review",
    "n_plus_one_or_redundant_data_access",
    "usage_pattern_break_without_explicit_requirement",
    "parallel_product_identity",
    "domain_without_owner",
    "learning_as_guard_authority",
    "arena_as_oracle_authority"
  ],
  "compatibility_policy": {
    "required_metadata": [
      "status",
      "canonical_owner",
      "replacement",
      "removal_condition"
    ],
    "statuses": [
      "canonical",
      "adapter",
      "strategy",
      "view",
      "deprecated",
      "historical"
    ],
    "rule": "A compatibility surface without an explicit replacement and removal condition is architecture debt, not a permanent second path."
  },
  "enforcement": {
    "validator": "scripts/validate_architecture.py",
    "tests": "tests/test_architecture_contract.py",
    "ci": ".github/workflows/architecture-integrity.yml",
    "hard_fail": true
  }
}
